# An example deployment. Put a reverse proxy with TLS (Caddy, nginx, or
# similar) in front of port 3014, and set SENDSCORE_TRUST_PROXY=true in .env.
# Port 25 on the host is the SMTP receiver, so the domain's MX record must
# point at this host.
services:
  app:
    image: sendscore-app
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "25:2525"
      - "127.0.0.1:3014:3014"
    volumes:
      - sendscore-data:/data
      # The certificate for the mail domain, readable by uid 65532. Mount
      # the directory, not the files, so a renewal is picked up.
      # - /srv/sendscore/certs:/certs:ro
    # The app gives open sessions 70 seconds to finish on SIGTERM, then the
    # heartbeat 15 more.
    stop_grace_period: 90s
    # It parses mail from anyone, so it gets no more than it needs: nothing
    # but /data and /tmp is writable, and uploads spill to /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    environment:
      GOMEMLIMIT: 850MiB

volumes:
  sendscore-data:
